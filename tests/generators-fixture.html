<!doctype html><meta charset="utf-8"><title>Generator view test fixture</title>
<style>body{margin:0;font:14px Arial;background:#fafafa}mle-generators{--primary-text-color:#222;--secondary-text-color:#666;--card-background-color:white;--divider-color:#ddd;--primary-color:#03a9f4;--error-color:#b00020}</style>
<mle-generators></mle-generators>
<script type="module">
import '../frontend/generators.js';
const states={};
const meter=(id,value,unit)=>states[id]={entity_id:id,state:String(value),attributes:{unit_of_measurement:unit,state_class:'total_increasing',friendly_name:id+" very long meter description".repeat(20)}};
for(const [id,value] of [['solar',12],['g1',8],['g2',3],['import',5],['export',4],['charge',2],['discharge',2]])meter(`sensor.${id}`,value,'kWh');
meter('sensor.gas1',2,'m³');meter('sensor.gas2',1,'m³');meter('sensor.power1',2000,'W');meter('sensor.flow1',0.5,'m³/h');
window.saved=[];
const generators=[{id:'g1',name:'Generator 1',energy:'sensor.g1',power:'sensor.power1',gas:'sensor.gas1',gas_power:'sensor.flow1',gas_unit:'m³',factor:10,basis:'LHV'},{id:'g2',name:'Generator 2',energy:'sensor.g2',gas:'sensor.gas2',gas_unit:'m³',factor:10,basis:'LHV'}];
const hass={states,config:{time_zone:'Europe/Lisbon'},async callWS(msg){
 if(msg.type.endsWith('generators/get'))return structuredClone(generators);
 if(msg.type.endsWith('generators/set')){window.saved.push(msg);return msg.generators;}
 if(msg.type.endsWith('generators/period'))return {start:msg.start+'T00:00:00Z',end:msg.end+'T23:59:59Z'};
 if(msg.type==='recorder/statistics_during_period')return Object.fromEntries(msg.statistic_ids.map(id=>[id,[{start:0,end:3600000,change:Number(states[id].state)}]]));
 throw new Error('Unexpected call '+msg.type);
}};
await document.querySelector('mle-generators').configure(hass,'test-location',{energy_sources:[{type:'solar',stat_energy_from:'sensor.solar'},{type:'grid',stat_energy_from:'sensor.import',stat_energy_to:'sensor.export'},{type:'battery',stat_energy_from:'sensor.discharge',stat_energy_to:'sensor.charge'}]});
window.ready=true;
</script>
